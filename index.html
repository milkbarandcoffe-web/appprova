<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installa Gsrt</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f6f8; text-align: center; }
        .box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 320px; }
        button { background: #0d6efd; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Gsrt</h1>
        <p>Installa l'app per un accesso rapido a schermo intero senza barre.</p>
        <button id="btn" style="display:none;">Installa App</button>
        <div id="msg" style="display:none; color: green; font-weight: bold; margin-top:15px;">App Installata!</div>
    </div>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        let promptEvent;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            promptEvent = e;
            document.getElementById('btn').style.display = 'block';
        });
        document.getElementById('btn').addEventListener('click', async () => {
            if (promptEvent) {
                promptEvent.prompt();
                const { outcome } = await promptEvent.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('btn').style.display = 'none';
                    document.getElementById('msg').style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
